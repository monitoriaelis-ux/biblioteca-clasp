<!-- Seção "Nora Roberts" — dados da aba "Nora Roberts" da planilha (exibida dentro do Front.html). -->
<div class="nr-layout">

  <!-- Abas + filtros -->
  <div class="nr-bar">
    <div class="inc-tabs">
      <button type="button" class="inc-tab active" data-nr-aba="unicos">Títulos únicos</button>
      <button type="button" class="inc-tab" data-nr-aba="series">Séries</button>
      <button type="button" class="inc-tab" data-nr-aba="mortal">Série Mortal</button>
    </div>
    <div class="nr-toolbar">
      <div class="fanfic-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="nr-busca" placeholder="Buscar por título original ou traduzido..." autocomplete="off">
        <button type="button" id="nr-busca-x" class="fanfic-search-clear" title="Limpar busca" hidden><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="nr-chip" class="fanfic-serie-chip" hidden>
        <i class="fa-solid fa-filter"></i><span id="nr-chip-nome"></span>
        <button type="button" id="nr-chip-x" title="Remover filtro"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="fanfic-seg">
        <button type="button" class="fanfic-seg-btn active" data-nr-leitura="todas">Todas</button>
        <button type="button" class="fanfic-seg-btn" data-nr-leitura="naolidas">Não lidas</button>
      </div>
      <button type="button" class="fanfic-sort-btn" data-nr-ordem="alfa"><i class="fa-solid fa-arrow-down-a-z"></i> <span>A-Z</span></button>
      <button type="button" class="fanfic-sort-btn" data-nr-ordem="paginas"><i class="fa-solid fa-arrow-down-wide-short"></i> <span>Páginas</span></button>
      <button type="button" class="fanfic-sort-btn" data-nr-ordem="ano"><i class="fa-solid fa-calendar"></i> <span>Ano</span></button>
    </div>
  </div>

  <!-- Lista + indicadores da aba (fixos à direita) -->
  <div class="nr-body">
    <!-- Indicadores gerais: fixos, não mudam com aba, busca ou filtro -->
    <aside class="nr-geral">
      <div class="nr-painel-titulo"><i class="fa-solid fa-crown"></i> Geral</div>
      <div class="nr-stat nota"><span class="nr-stat-label">Nota média</span><span class="nr-stat-valor" id="nr-k-nota">–</span><span class="nr-stat-sub" id="nr-k-nota-sub"></span></div>
      <div class="nr-stat obras"><span class="nr-stat-label">Obras</span><span class="nr-stat-valor" id="nr-k-total">–</span></div>
      <div class="nr-stat lidas"><span class="nr-stat-label">Lidas</span><span class="nr-stat-valor" id="nr-k-lidas">–</span><span class="nr-stat-sub" id="nr-k-lidas-sub"></span></div>
      <div class="nr-stat tenho"><span class="nr-stat-label">Adquiridas</span><span class="nr-stat-valor" id="nr-k-tenho">–</span><span class="nr-stat-sub" id="nr-k-tenho-sub"></span></div>
    </aside>
    <!-- Indicadores da aba atual -->
    <aside class="nr-side-wrap">
      <div class="nr-painel-titulo" id="nr-side-titulo">Nesta aba</div>
      <div class="nr-side" id="nr-side"></div>
    </aside>
    <div class="nr-list-scroll">
      <div class="nr-row nr-header">
        <span></span><span class="col-titulo">Título</span><span>Ano</span><span>Páginas</span><span>Obs.</span><span>Status</span><span>Nota</span><span></span><span></span>
      </div>
      <div id="nr-lista" class="obras-list"><div class="obras-vazio">Carregando obras da Nora...</div></div>
    </div>
  </div>

  <div id="nr-toast" class="fanfic-toast"></div>
</div>

<style>
  .nr-layout { height: 100%; display: flex; flex-direction: column; gap: 12px; }

  /* ===== Abas + filtros ===== */
  .nr-bar { flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
  .nr-toolbar { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .nr-toolbar .fanfic-search { flex: 1; min-width: 160px; }
  .inc-tab { white-space: nowrap; }

  /* ===== Lista + lateral ===== */
  .nr-body { flex: 1; min-height: 0; display: flex; gap: 16px; }
  .nr-list-scroll { flex: 1; min-width: 0; overflow-y: auto; padding-right: 4px; }
  .nr-geral, .nr-side-wrap { width: 140px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .nr-geral { background: #E9DCC9; border-radius: 14px; padding: 8px; }
  .nr-side-wrap { padding: 8px 0; }
  .nr-side { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .nr-painel-titulo {
    flex-shrink: 0; text-align: center; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--texto-marrom); padding: 2px 0 4px;
  }
  .nr-geral .nr-painel-titulo i { color: #A0763F; margin-right: 4px; }
  .nr-side-wrap .nr-painel-titulo { color: var(--texto-secundario); }

  .nr-row {
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr) 56px 72px 100px 150px 106px 22px 22px;
    align-items: center;
    gap: 12px;
  }
  .nr-header {
    position: sticky; top: 0; z-index: 5; background: var(--bg-creme); padding: 0 12px 6px 19px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--texto-secundario);
  }
  .nr-header span { text-align: center; }
  .nr-header .col-titulo { text-align: left; }
  .nr-card {
    --status-cor: var(--borda-bege);
    background: var(--bg-cards); border-radius: 10px; padding: 0 12px 0 14px; min-height: 72px;
    box-shadow: 0 3px 10px rgba(155, 125, 97, 0.05); border-left: 5px solid var(--status-cor);
  }
  .nr-card:hover { box-shadow: 0 4px 14px rgba(155, 125, 97, 0.1); }
  .nr-card > .nr-row { min-height: 72px; }
  .nr-card.st-lido { --status-cor: var(--cor-livro); }
  .nr-card.st-lendo { --status-cor: #F2D45C; }
  .nr-card.st-quero { --status-cor: var(--cor-fanfic); }
  .nr-card.salvando .nr-status-cel, .nr-card.salvando .obra-nota { opacity: 0.6; pointer-events: none; }

  .nr-cel { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--texto-marrom); }
  .nr-titulo-bloco { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .nr-titulo { font-weight: 700; font-size: 13.5px; color: var(--texto-marrom); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nr-sub { font-size: 11px; color: var(--texto-secundario); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nr-sub .trad { font-style: italic; }
  .nr-link { color: var(--texto-marrom); font-weight: 600; cursor: pointer; }
  .nr-link:hover { color: #6f948a; text-decoration: underline; }
  .nr-obs {
    font-size: 10.5px; font-weight: 600; background: var(--hover-bege); color: var(--texto-marrom);
    padding: 3px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .nr-obs:hover { background: #e3ece8; color: #4f6f65; }
  .nr-vazio { color: var(--borda-bege); }
  .nr-icones { display: flex; justify-content: center; font-size: 13px; }
  .nr-titulo-linha { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .nr-titulo-linha .nr-icone-fav { font-size: 11px; flex-shrink: 0; }
  .nr-card.aberta .obra-expand { transform: rotate(180deg); }
  .nr-plot {
    display: none; font-size: 12.5px; line-height: 1.6; color: var(--texto-marrom);
    border-top: 1px dashed var(--hover-bege); padding: 10px 40px 14px 52px; white-space: pre-line;
  }
  .nr-card.aberta .nr-plot { display: block; }
  .nr-icone-tenho { color: #6f948a; }
  .nr-icone-fav { color: #e0607e; }

  /* Lateral: indicadores da aba */
  .nr-stat {
    flex: 1; min-height: 0; max-height: 86px;
    background: var(--bg-cards); border-radius: 10px; padding: 4px 10px; box-shadow: 0 3px 8px rgba(155, 125, 97, 0.03);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1px;
  }
  .nr-stat-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--texto-secundario); }
  .nr-stat-valor { font-size: 15px; font-weight: 700; color: var(--texto-marrom); line-height: 1.2; }
  .nr-stat-sub { font-size: 9.5px; font-weight: 600; color: var(--texto-secundario); white-space: nowrap; }
  .nr-stat.obras { background: #DCE3CB; }
  .nr-stat.obras .nr-stat-valor { color: #56663A; }
  .nr-stat.lidas { background: #e3ece8; }
  .nr-stat.naolidas { background: #fbeee8; }
  .nr-stat.tenho { background: #f3ece1; }
  .nr-geral .nr-stat.tenho { background: #F7F1E8; }
  .nr-stat.nota { background: #fff9c4; }
  .nr-stat .split-bar { width: 100%; margin-top: 4px; }
</style>

<script>
  // ===== Estado =====
  let nrObras = [];
  let nrCarregado = false, nrCarregando = false;
  let nrAba = 'unicos';
  const nrFiltros = {}; // por aba: { busca, leitura, ordem, asc, serie, obs }
  ['unicos', 'series', 'mortal'].forEach(a => nrFiltros[a] = { busca: '', leitura: 'todas', ordem: null, asc: true, serie: null, obs: null });
  let nrStatusAberto = null;

  // ===== Utilidades =====
  const nrNorm = v => (v === undefined || v === null ? '' : String(v)).trim().toLowerCase();
  const nrSemAcento = v => nrNorm(v).normalize('NFD').replace(/[̀-ͯ]/g, '');
  const nrEsc = v => (v === undefined || v === null ? '' : String(v)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const nrNum = v => { const n = parseFloat(String(v === undefined || v === null ? '' : v).replace(',', '.')); return isNaN(n) ? null : n; };
  const nrSim = v => v === true || ['sim', 's', 'x', 'true', 'verdadeiro', 'yes'].includes(nrNorm(v));

  const nrTitulo = o => (o['Título original'] || '').toString().trim();
  const nrTraduzido = o => (o['Titulo traduzido'] || o['Título traduzido'] || '').toString().trim();
  const nrSerie = o => { const s = (o['Série'] || '').toString().trim(); return ['', '-', 'não', 'nao', 'n/a'].includes(nrNorm(s)) ? '' : s; };
  const nrMortal = o => /mortal|in death/.test(nrSemAcento(nrSerie(o)));
  const nrOrdemSerie = o => { const n = nrNum(o['Ordem na série']); return n === null ? Infinity : n; };
  const nrLida = o => nrNorm(o['Status']) === 'lido';
  const nrTenho = o => nrSim(o['Tenho?']);
  // Favorito (coluna M): qualquer valor preenchido conta, menos "não"/"falso"/"0"/"-"
  const nrFav = o => {
    const v = o._fav !== undefined ? o._fav : o['Favorito'];
    if (v === true) return true;
    const t = nrNorm(v);
    return !!t && !['não', 'nao', 'n', 'false', 'falso', '0', '-', 'no'].includes(t);
  };
  const nrNota = o => nrNum(o['Nota']);
  const nrAno = o => nrNum(o['Ano']);
  const nrPaginas = o => nrNum(o['Páginas']);
  const nrObs = o => (o['Obs'] || '').toString().trim();
  function nrDecada(o) {
    const ano = nrAno(o);
    if (ano && ano > 1000) return Math.floor(ano / 10) * 10;
    const d = String(o['Década'] || '').match(/\d{2,4}/);
    if (!d) return null;
    let n = Number(d[0]);
    if (n < 100) n += n >= 30 ? 1900 : 2000;
    return Math.floor(n / 10) * 10;
  }

  function nrDaAba(aba) {
    return nrObras.filter(o => {
      const s = nrSerie(o);
      if (aba === 'unicos') return !s;
      if (aba === 'mortal') return s && nrMortal(o);
      return s && !nrMortal(o);
    });
  }

  function nrResumo(lista) {
    const lidas = lista.filter(nrLida).length;
    const tenho = lista.filter(nrTenho).length;
    const notas = lista.map(nrNota).filter(n => n !== null && n > 0);
    return {
      total: lista.length, lidas, naoLidas: lista.length - lidas, tenho,
      nota: notas.length ? notas.reduce((a, b) => a + b, 0) / notas.length : 0, avaliadas: notas.length
    };
  }
  const nrPct = (a, b) => b ? Math.round(a / b * 100) : 0;

  // ===== Carregamento =====
  function renderNora() {
    if (!nrCarregado) {
      if (nrCarregando) return;
      nrCarregando = true;
      nrLigarEventos();
      google.script.run
        .withSuccessHandler(raw => {
          const d = JSON.parse(raw);
          nrObras = d.obras || [];
          nrCarregado = true; nrCarregando = false;
          if (d.erro) nrToast(d.erro, true);
          nrRenderTudo();
        })
        .withFailureHandler(err => {
          nrCarregando = false;
          document.getElementById('nr-lista').innerHTML = `<div class="obras-vazio">Não foi possível carregar: ${nrEsc(err && err.message ? err.message : err)}</div>`;
        })
        .getNoraDataAPI();
      return;
    }
    nrRenderTudo();
  }

  function nrRenderTudo() {
    nrRenderKpis();
    nrRenderAba();
  }

  // ===== Indicadores gerais =====
  function nrRenderKpis() {
    const r = nrResumo(nrObras);
    document.getElementById('nr-k-total').textContent = r.total;
    document.getElementById('nr-k-lidas').textContent = r.lidas;
    document.getElementById('nr-k-lidas-sub').textContent = `${nrPct(r.lidas, r.total)}%`;
    document.getElementById('nr-k-tenho').textContent = r.tenho;
    document.getElementById('nr-k-tenho-sub').textContent = `${nrPct(r.tenho, r.total)}% · faltam ${r.total - r.tenho}`;
    document.getElementById('nr-k-nota').textContent = r.nota.toFixed(1);
    document.getElementById('nr-k-nota-sub').textContent = `${r.avaliadas} ${r.avaliadas === 1 ? 'avaliação' : 'avaliações'}`;
  }

  // ===== Abas, filtros e lista =====
  function nrLigarEventos() {
    document.querySelectorAll('[data-nr-aba]').forEach(b => b.addEventListener('click', () => {
      nrAba = b.dataset.nrAba;
      document.querySelectorAll('[data-nr-aba]').forEach(x => x.classList.toggle('active', x === b));
      const f = nrFiltros[nrAba];
      document.getElementById('nr-busca').value = f.busca;
      nrRenderAba();
      document.querySelector('.nr-list-scroll').scrollTop = 0;
    }));
    const busca = document.getElementById('nr-busca');
    busca.addEventListener('input', () => { nrFiltros[nrAba].busca = busca.value; nrRenderAba(); });
    document.getElementById('nr-busca-x').addEventListener('click', () => { busca.value = ''; nrFiltros[nrAba].busca = ''; nrRenderAba(); busca.focus(); });
    document.getElementById('nr-chip-x').addEventListener('click', () => { const f = nrFiltros[nrAba]; f.serie = null; f.obs = null; nrRenderAba(); });
    document.querySelectorAll('[data-nr-leitura]').forEach(b => b.addEventListener('click', () => { nrFiltros[nrAba].leitura = b.dataset.nrLeitura; nrRenderAba(); }));
    document.querySelectorAll('[data-nr-ordem]').forEach(b => b.addEventListener('click', () => {
      // 1º clique ativa, 2º inverte, 3º remove
      const f = nrFiltros[nrAba], tipo = b.dataset.nrOrdem, ascPadrao = tipo !== 'paginas'; // A-Z e Ano crescentes; Páginas: maiores primeiro
      if (f.ordem !== tipo) { f.ordem = tipo; f.asc = ascPadrao; }
      else if (f.asc === ascPadrao) f.asc = !ascPadrao;
      else f.ordem = null;
      nrRenderAba();
    }));
    document.addEventListener('click', () => {
      if (nrStatusAberto === null) return;
      nrStatusAberto = null;
      document.querySelectorAll('#nr-lista .status-dd.aberto').forEach(d => d.classList.remove('aberto', 'pra-cima'));
    });
  }

  function nrFiltrarSerie(i, ev) {
    ev.stopPropagation();
    const f = nrFiltros[nrAba];
    f.serie = nrSerie(nrObras[i]); f.obs = null; f.busca = '';
    document.getElementById('nr-busca').value = '';
    nrRenderAba();
    document.querySelector('.nr-list-scroll').scrollTop = 0;
  }
  function nrFiltrarObs(i, ev) {
    ev.stopPropagation();
    const f = nrFiltros[nrAba];
    f.obs = nrObs(nrObras[i]); f.serie = null;
    nrRenderAba();
    document.querySelector('.nr-list-scroll').scrollTop = 0;
  }

  function nrListaFiltrada() {
    const f = nrFiltros[nrAba];
    let lista = nrDaAba(nrAba);
    if (f.serie) {
      return lista.filter(o => nrNorm(nrSerie(o)) === nrNorm(f.serie)).sort((a, b) => nrOrdemSerie(a) - nrOrdemSerie(b));
    }
    if (f.obs) lista = lista.filter(o => nrNorm(nrObs(o)) === nrNorm(f.obs));
    if (f.leitura === 'naolidas') lista = lista.filter(o => !nrLida(o));
    const termo = nrSemAcento(f.busca);
    if (termo) lista = lista.filter(o => nrSemAcento(nrTitulo(o)).includes(termo) || nrSemAcento(nrTraduzido(o)).includes(termo));

    // Ordem padrão de cada aba
    if (nrAba === 'series') {
      lista = lista.slice().sort((a, b) => nrSerie(a).localeCompare(nrSerie(b), 'pt-BR', { sensitivity: 'base' }) || nrOrdemSerie(a) - nrOrdemSerie(b));
    } else if (nrAba === 'mortal') {
      lista = lista.slice().sort((a, b) => nrOrdemSerie(a) - nrOrdemSerie(b));
    }
    // Ordenação escolhida
    if (f.ordem) {
      const chave = f.ordem === 'alfa' ? null : f.ordem === 'paginas' ? nrPaginas : nrAno;
      lista = lista.slice().sort((a, b) => chave
        ? (chave(a) === null ? Infinity : chave(a)) - (chave(b) === null ? Infinity : chave(b))
        : nrTitulo(a).localeCompare(nrTitulo(b), 'pt-BR', { sensitivity: 'base' }));
      if (!f.asc) lista.reverse();
      // Na aba Séries, com A-Z, os volumes de cada série continuam juntos e em ordem
      if (nrAba === 'series' && f.ordem === 'alfa') {
        const grupos = {}, vistos = new Set(), res = [];
        lista.forEach(o => (grupos[nrNorm(nrSerie(o))] = grupos[nrNorm(nrSerie(o))] || []).push(o));
        Object.values(grupos).forEach(g => g.sort((a, b) => nrOrdemSerie(a) - nrOrdemSerie(b)));
        lista.forEach(o => { const k = nrNorm(nrSerie(o)); if (!vistos.has(k)) { vistos.add(k); res.push(...grupos[k]); } });
        lista = res;
      }
    }
    return lista;
  }

  function nrRenderAba() {
    const f = nrFiltros[nrAba];
    // estado dos controles
    document.getElementById('nr-busca-x').hidden = !f.busca;
    const chip = document.getElementById('nr-chip');
    chip.hidden = !(f.serie || f.obs);
    document.getElementById('nr-chip-nome').textContent = f.serie || f.obs || '';
    document.querySelectorAll('[data-nr-leitura]').forEach(b => b.classList.toggle('active', b.dataset.nrLeitura === f.leitura));
    document.querySelectorAll('[data-nr-ordem]').forEach(b => {
      const ativo = !f.serie && f.ordem === b.dataset.nrOrdem;
      b.classList.toggle('active', ativo);
      b.disabled = !!f.serie;
      if (b.dataset.nrOrdem === 'alfa') b.querySelector('span').textContent = ativo && !f.asc ? 'Z-A' : 'A-Z';
      b.title = !ativo ? 'Ordenar' : 'Clique para inverter; o 3º clique remove a ordenação';
    });

    nrRenderLateral();

    const lista = nrListaFiltrada();
    const el = document.getElementById('nr-lista');
    if (!lista.length) {
      el.innerHTML = `<div class="obras-vazio">${f.busca ? `Nada encontrado para "${nrEsc(f.busca)}".` : 'Nenhuma obra aqui.'}</div>`;
      return;
    }
    el.innerHTML = lista.map(nrRenderLinha).join('');
  }

  function nrRenderLinha(o) {
    const i = nrObras.indexOf(o);
    const lida = nrLida(o);
    const st = nrNorm(o['Status']);
    const cls = st === 'lido' ? 'st-lido' : st === 'lendo' ? 'st-lendo' : st === 'quero ler' ? 'st-quero' : '';
    const trad = nrTraduzido(o);
    const serie = nrSerie(o);
    const ordem = nrOrdemSerie(o);
    const obs = nrObs(o);
    const plot = (o._plot || o['Plot'] || '').toString().trim();
    const capa = o._capa ? `<img class="obra-capa" src="${nrEsc(o._capa)}" loading="lazy" alt="">` : `<div class="obra-capa"><i class="fa-solid fa-book"></i></div>`;

    let sub = trad ? `<span class="trad">${nrEsc(trad)}</span>` : '';
    if (serie && nrAba === 'series') sub += `${sub ? ' · ' : ''}<span class="nr-link" title="Ver a série toda" onclick="nrFiltrarSerie(${i}, event)"><i class="fa-solid fa-layer-group"></i> ${nrEsc(serie)}${ordem !== Infinity ? `, vol. ${ordem}` : ''}</span>`;
    if (serie && nrAba === 'mortal' && ordem !== Infinity) sub += `${sub ? ' · ' : ''}<span>nº ${ordem}</span>`;

    let stars = '';
    const nota = nrNota(o) || 0;
    for (let v = 1; v <= 5; v++) stars += `<i class="${nota >= v ? 'fa-solid fa-star' : nota >= v - 0.5 ? 'fa-solid fa-star-half-stroke' : 'fa-regular fa-star'}" data-v="${v}"></i>`;

    const statusAtual = (o['Status'] || '').toString().trim();
    const statusHtml = lida ? '<span class="obra-status-fixo">Lido</span>' : `
      <div class="status-dd${nrStatusAberto === i ? ' aberto' : ''}" id="nr-dd-${i}">
        <button type="button" class="obra-status" onclick="nrToggleStatus(${i}, event)">${nrEsc(statusAtual || 'Selecione')} <i class="fa-solid fa-chevron-down"></i></button>
        <div class="status-dd-menu" onclick="event.stopPropagation()">
          ${['Lido', 'Lendo', 'Quero ler'].map(s => `<button type="button" class="${nrNorm(s) === st ? 'atual' : ''}" onclick="nrAlterarStatus(${i}, '${s}')"><span class="dot" style="background:${s === 'Lido' ? 'var(--cor-livro)' : s === 'Lendo' ? '#F2D45C' : 'var(--cor-fanfic)'}"></span>${s}</button>`).join('')}
        </div>
      </div>`;

    return `
      <div class="nr-card ${cls}${nrAberta === i ? ' aberta' : ''}" data-i="${i}">
        <div class="nr-row">
          ${capa}
          <div class="nr-titulo-bloco">
            <div class="nr-titulo-linha">
              <span class="nr-titulo" title="${nrEsc(nrTitulo(o))}">${nrEsc(nrTitulo(o) || trad || 'Sem título')}</span>
              ${nrFav(o) ? '<i class="fa-solid fa-heart nr-icone-fav" title="Favorito"></i>' : ''}
            </div>
            ${sub ? `<span class="nr-sub">${sub}</span>` : ''}
          </div>
          <span class="nr-cel">${nrAno(o) || '<span class="nr-vazio">—</span>'}</span>
          <span class="nr-cel">${nrPaginas(o) ? nrPaginas(o).toLocaleString('pt-BR') : '<span class="nr-vazio">—</span>'}</span>
          <span class="nr-cel">${obs ? `<span class="nr-obs" title="Filtrar por ${nrEsc(obs)}" onclick="nrFiltrarObs(${i}, event)">${nrEsc(obs)}</span>` : '<span class="nr-vazio">—</span>'}</span>
          <div class="nr-cel nr-status-cel">${statusHtml}</div>
          <div class="nr-cel"><div class="obra-nota ${lida ? 'editavel' : 'bloqueada'}" title="${lida ? 'Clique para dar a nota (mesma estrela limpa)' : 'Marque como Lido para avaliar'}" ${lida ? `onclick="nrAlterarNota(${i}, event)"` : ''}>${stars}</div></div>
          <div class="nr-icones">${nrTenho(o) ? '<i class="fa-solid fa-bag-shopping nr-icone-tenho" title="Tenho"></i>' : ''}</div>
          ${plot ? `<button type="button" class="obra-expand" onclick="nrToggleObra(${i})" title="Ver plot"><i class="fa-solid fa-chevron-down"></i></button>` : '<span></span>'}
        </div>
        ${plot ? `<div class="nr-plot">${nrEsc(plot)}</div>` : ''}
      </div>`;
  }

  function nrRenderLateral() {
    const lista = nrDaAba(nrAba);
    const r = nrResumo(lista);
    const stat = (cls, label, valor, sub, extra) => `
      <div class="nr-stat ${cls}"><span class="nr-stat-label">${label}</span><span class="nr-stat-valor">${valor}</span>${sub ? `<span class="nr-stat-sub">${sub}</span>` : ''}${extra || ''}</div>`;
    let html = stat('nota', 'Nota média', r.nota.toFixed(1), `${r.avaliadas} ${r.avaliadas === 1 ? 'avaliação' : 'avaliações'}`);
    html += stat('obras', 'Obras', r.total);
    if (nrAba === 'series') html += stat('', 'Séries', new Set(lista.map(o => nrNorm(nrSerie(o)))).size);
    html += stat('lidas', 'Lidas', r.lidas, `${nrPct(r.lidas, r.total)}%`,
      `<div class="split-bar"><div class="split-bar-lidas" style="width:${nrPct(r.lidas, r.total)}%"></div><div class="split-bar-naolidas" style="width:${r.total ? 100 - nrPct(r.lidas, r.total) : 0}%"></div></div>`);
    html += stat('naolidas', 'Não lidas', r.naoLidas, `${r.total ? 100 - nrPct(r.lidas, r.total) : 0}%`);
    html += stat('tenho', 'Adquiridas', r.tenho, `${nrPct(r.tenho, r.total)}% · faltam ${r.total - r.tenho}`);
    document.getElementById('nr-side').innerHTML = html;
    document.getElementById('nr-side-titulo').textContent = { unicos: 'Títulos únicos', series: 'Séries', mortal: 'Série Mortal' }[nrAba];
  }

  // ===== Plot expansível (uma obra por vez) =====
  let nrAberta = null;
  function nrToggleObra(i) {
    nrAberta = nrAberta === i ? null : i;
    document.querySelectorAll('#nr-lista .nr-card.aberta').forEach(c => c.classList.remove('aberta'));
    const card = document.querySelector(`.nr-card[data-i="${i}"]`);
    if (card && nrAberta === i) card.classList.add('aberta');
  }

  // ===== Edição (status e nota) =====
  function nrToggleStatus(i, ev) {
    ev.stopPropagation();
    const dd = document.getElementById('nr-dd-' + i);
    const abrir = !dd.classList.contains('aberto');
    document.querySelectorAll('#nr-lista .status-dd.aberto').forEach(d => d.classList.remove('aberto', 'pra-cima'));
    nrStatusAberto = null;
    if (!abrir) return;
    dd.classList.add('aberto');
    nrStatusAberto = i;
    const lista = document.querySelector('.nr-list-scroll').getBoundingClientRect();
    if (dd.querySelector('.status-dd-menu').getBoundingClientRect().bottom > lista.bottom) dd.classList.add('pra-cima');
  }

  let nrToastTimer = null;
  function nrToast(msg, erro) {
    const t = document.getElementById('nr-toast');
    t.textContent = msg;
    t.classList.toggle('erro', !!erro);
    t.classList.add('show');
    clearTimeout(nrToastTimer);
    nrToastTimer = setTimeout(() => t.classList.remove('show'), erro ? 5000 : 1800);
  }

  function nrSalvar(i, campos, anterior, opcoes) {
    const o = nrObras[i];
    nrToast('Salvando...');
    const payload = Object.assign({ aba: 'Nora Roberts', row: o._row, titulo: nrTitulo(o), campos }, opcoes || {});
    google.script.run
      .withSuccessHandler(raw => {
        const r = JSON.parse(raw);
        if (r.row) o._row = r.row;
        if (r.ano && r.colunaAno) o[r.colunaAno] = r.ano;
        nrRenderTudo();
        if (r.avisos && r.avisos.length) nrToast('Salvo, mas: ' + r.avisos.join('; '), true);
        else nrToast('Salvo na planilha ✓');
      })
      .withFailureHandler(err => {
        Object.assign(o, anterior);
        nrRenderTudo();
        nrToast('Não foi possível salvar: ' + (err && err.message ? err.message : err), true);
      })
      .updateObraAPI(JSON.stringify(payload));
    nrRenderTudo();
    const card = document.querySelector(`.nr-card[data-i="${i}"]`);
    if (card) card.classList.add('salvando');
  }

  function nrAlterarStatus(i, novo) {
    nrStatusAberto = null;
    const o = nrObras[i];
    if (!o || novo === o['Status']) { nrRenderAba(); return; }
    const anterior = { Status: o['Status'] };
    o['Status'] = novo;
    nrSalvar(i, { Status: novo }, anterior, { marcarLeitura: novo === 'Lido' });
  }

  function nrAlterarNota(i, ev) {
    const v = Number(ev.target && ev.target.dataset ? ev.target.dataset.v : 0);
    const o = nrObras[i];
    if (!v || !o || !nrLida(o)) return;
    const nova = (nrNota(o) === v) ? '' : v;
    const anterior = { Nota: o['Nota'] };
    o['Nota'] = nova;
    nrSalvar(i, { Nota: nova }, anterior);
  }
</script>
