<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --cor-livro: #92ADA4;   
      --cor-ebook: #FED8A6;   
      --cor-fanfic: #DAA38F;  
      --bg-creme: #F9F6F0;        
      --bg-cards: #FFFFFF;        
      --texto-marrom: #5A4736;    
      --texto-secundario: #9B7D61;
      --borda-bege: #E9D7C0;      
      --hover-bege: #F3ECE1;      
    }

    * { box-sizing: border-box; }
    .top-header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 50; background: var(--bg-cards); box-shadow: 0 4px 15px rgba(155, 125, 97, 0.08);
    }

    .header-image {
      width: 100%; height: 55px; background-image: url('https://i.ibb.co/h1nNjGyf/Design-sem-nome-6.png'); background-size: auto 100%; background-repeat: repeat-x; background-position: center bottom; 
    }

    .nav-menu {
      display: flex; justify-content: center; align-items: center; height: 38px; gap: 25px; 
    }
