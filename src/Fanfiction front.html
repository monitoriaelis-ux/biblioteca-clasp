</div>

  .obras-vazio { text-align: center; color: var(--texto-secundario); padding: 40px; }

  .fanfic-toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: var(--texto-marrom);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(90, 71, 54, 0.25);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 200;
  }
  .fanfic-toast.show { opacity: 1; transform: translateY(0); }
  .fanfic-toast.erro { background: #b4534b; }
</style>

<script>
  // ===== Configuração dos fandoms =====
  // "nome" é o que aparece no card. "aliases" são outras grafias aceitas na coluna Fandom
  // da planilha (maiúsculas/minúsculas e espaços nas pontas são ignorados).
  // "Outros" reúne toda fanfic cujo fandom não está na lista acima (ou está em branco).
  const FANDOMS = [
    { nome: 'House',      aliases: ['House M.D.', 'House MD'] },
    { nome: 'Bones',      aliases: [] },
    { nome: 'Avengers',   aliases: ['The Avengers', 'Vingadores'] },
    { nome: 'Station 19', aliases: [] },
    { nome: 'Gaga',       aliases: ['Lady Gaga'] },
    { nome: 'Outros',     outros: true }
  ];
  const TOP_AUTORES = 10;

  // Estado da página
  let fandomFiltro = null;          // null = todos os fandoms
  let fanficBusca = '';             // texto da caixa de pesquisa
  let fanficOrdem = null;           // null | 'alfa' | 'palavras'
  let fanficOrdemAsc = true;        // direção da ordenação
  let fanficLeitura = 'todas';      // 'todas' | 'naolidas' (filtro só da lista)
  let fanficSerie = null;           // nome da série selecionada (mostra a série toda)

  function serieDaObra(f) {
    const serie = (f['Série'] || '').toString().trim();
    return serie && !['não', 'nao', 'n', '-'].includes(fanficNorm(serie)) ? serie : '';
  }
  function volumeDaObra(f) {
    const v = parseFloat((f['Volume'] === undefined || f['Volume'] === null ? '' : f['Volume']).toString().replace(',', '.'));
    return isNaN(v) ? Infinity : v;
  }
  // Mantém cada série junta, na posição do primeiro volume que aparece, em ordem de volume
  function agruparSeries(list) {
    const grupos = {};
    list.forEach(f => {
      const k = fanficNorm(serieDaObra(f));
      if (k) (grupos[k] = grupos[k] || []).push(f);
    });
    Object.values(grupos).forEach(g => g.sort((a, b) => volumeDaObra(a) - volumeDaObra(b)));
    const vistos = new Set();
    const res = [];
    list.forEach(f => {
      const k = fanficNorm(serieDaObra(f));
      if (!k) { res.push(f); return; }
      if (vistos.has(k)) return;
      vistos.add(k);
      res.push(...grupos[k]);
    });
    return res;
  }

  function filtrarSerie(idx, ev) {
    if (ev) ev.stopPropagation();
    const f = allBooks[idx];
    if (!f) return;
    fanficSerie = serieDaObra(f);
    // a série toda: limpa a busca para não esconder volumes
    const busca = document.getElementById('fanfic-search');
    busca.value = ''; fanficBusca = '';
    document.getElementById('fanfic-search-clear').hidden = true;
    renderFanficsConteudo();
    document.querySelector('.fanfic-list-scroll').scrollTop = 0;
  }
  let fanficEventosOk = false;

  function fanficNorm(v) { return (v || '').toString().trim().toLowerCase(); }

  // Para a busca: ignora maiúsculas e acentos
  function fanficSemAcento(v) {
    return fanficNorm(v).normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function fanficEsc(v) {
    return (v === undefined || v === null ? '' : v.toString())
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fanficNum(v) {
    const n = parseFloat((v || '').toString().replace(/\./g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }

  function fanficLida(f) { return fanficNorm(f['Status']) === 'lido'; }

  function getTodasFanfics() {
    return (typeof allBooks !== 'undefined' ? allBooks : [])
      .filter(b => ['fanfiction', 'fanfic'].includes(fanficNorm(b['Tipo'])));
  }

  // Retorna o nome do card (FANDOMS[].nome) ao qual a fanfic pertence
  function fandomDaFanfic(f) {
    const valor = fanficNorm(f['Fandom']);
    const achado = FANDOMS.find(fd => !fd.outros &&
      [fd.nome].concat(fd.aliases || []).some(n => fanficNorm(n) === valor));
    return achado ? achado.nome : 'Outros';
  }

  // Fanfics do fandom selecionado (base para estatísticas, autores e lista)
  function getFanficsFiltradas() {
    const todas = getTodasFanfics();
    return fandomFiltro ? todas.filter(f => fandomDaFanfic(f) === fandomFiltro) : todas;
  }

  function splitBar(lidas, total) {
    const pL = total ? Math.round((lidas / total) * 100) : 0;
    const pN = total ? 100 - pL : 0;
    return {
      pL, pN,
      html: `<div class="split-bar"><div class="split-bar-lidas" style="width:${pL}%"></div><div class="split-bar-naolidas" style="width:${pN}%"></div></div>`
    };
  }

  // Chamada pela navbar sempre que a seção é aberta e quando os dados recarregam
  function renderFanficsView() {
    setupFanficEventos();
    renderFandomCards();
    renderFanficStats();
    renderFanficAutores();
    renderFanficsConteudo();
  }

  function setupFanficEventos() {
    if (fanficEventosOk) return;
    fanficEventosOk = true;

    document.getElementById('fandom-todos').addEventListener('click', () => {
      fandomFiltro = null;
      fanficSerie = null;
      renderFanficsView();
    });

    const busca = document.getElementById('fanfic-search');
    const limpar = document.getElementById('fanfic-search-clear');
    busca.addEventListener('input', e => {
      fanficBusca = e.target.value;
      limpar.hidden = !fanficBusca;
      if (fanficBusca) fanficSerie = null;
      renderFanficsConteudo();
    });
    limpar.addEventListener('click', () => {
      busca.value = '';
      fanficBusca = '';
      limpar.hidden = true;
      renderFanficsConteudo();
      busca.focus();
    });

    document.getElementById('fanfic-serie-clear').addEventListener('click', () => {
      fanficSerie = null;
      renderFanficsConteudo();
    });

    document.querySelectorAll('.fanfic-seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        fanficLeitura = btn.dataset.leitura;
        document.querySelectorAll('.fanfic-seg-btn').forEach(b => b.classList.toggle('active', b === btn));
        renderFanficsConteudo();
      });
    });

    // 1º clique ativa; cliques seguintes invertem a direção
    document.getElementById('sort-alfa').addEventListener('click', () => toggleOrdem('alfa', true));
    document.getElementById('sort-palavras').addEventListener('click', () => toggleOrdem('palavras', false));
  }

  function toggleOrdem(tipo, ascPadrao) {
    if (fanficOrdem === tipo) fanficOrdemAsc = !fanficOrdemAsc;
    else { fanficOrdem = tipo; fanficOrdemAsc = ascPadrao; }
    renderFanficsConteudo();
  }

  // ===== Coluna 1 =====
  function renderFandomCards() {
    const todas = getTodasFanfics();
    document.getElementById('fandom-todos-total').textContent = `(${todas.length})`;
    document.getElementById('fandom-todos').classList.toggle('selected', !fandomFiltro);

    const lista = document.getElementById('fandom-cards');
    lista.classList.toggle('has-selection', !!fandomFiltro);

    lista.innerHTML = FANDOMS.map(fd => {
      const doFandom = todas.filter(f => fandomDaFanfic(f) === fd.nome);
      const total = doFandom.length;
      const lidas = doFandom.filter(fanficLida).length;
      const bar = splitBar(lidas, total);
      const sel = fandomFiltro === fd.nome ? ' selected' : '';

      return `
        <div class="fandom-card${sel}" data-fandom="${fanficEsc(fd.nome)}"
             title="${total ? `${lidas} lidas · ${total - lidas} não lidas` : 'Nenhuma história cadastrada'}">
          <div class="fandom-card-top">
            <span class="fandom-name">${fanficEsc(fd.nome)}</span>
            <span class="fandom-total">${total}<small>${total === 1 ? 'história' : 'histórias'}</small></span>
          </div>
          ${bar.html}
          <div class="fandom-legend">
            <span><span class="dot" style="background: var(--cor-livro);"></span>Lidas ${bar.pL}%</span>
            <span><span class="dot" style="background: var(--cor-fanfic);"></span>Não lidas ${bar.pN}%</span>
          </div>
        </div>
      `;
    }).join('');

    lista.querySelectorAll('.fandom-card').forEach(card => {
      card.addEventListener('click', () => {
        const nome = card.dataset.fandom;
        fandomFiltro = (fandomFiltro === nome) ? null : nome; // clicar de novo remove o filtro
        fanficSerie = null;
        renderFanficsView();
      });
    });
  }

  // ===== Coluna 2: estatísticas =====
  function renderFanficStats() {
    const base = getFanficsFiltradas();
    const lidas = base.filter(fanficLida);

    document.getElementById('stat-lidas').textContent = lidas.length.toLocaleString('pt-BR');
    document.getElementById('stat-lidas-sub').textContent =
      base.length ? `de ${base.length} · ${Math.round(lidas.length / base.length * 100)}%` : 'nenhuma obra';

    const avaliadas = base.filter(f => f['Nota'] !== '' && f['Nota'] !== undefined && !isNaN(parseFloat(f['Nota'].toString().replace(',', '.'))));
    const nota = avaliadas.length
      ? avaliadas.reduce((s, f) => s + parseFloat(f['Nota'].toString().replace(',', '.')), 0) / avaliadas.length
      : 0;
    document.getElementById('stat-nota').textContent = nota.toFixed(1);
    document.getElementById('stat-nota-sub').textContent =
      avaliadas.length ? `${avaliadas.length} ${avaliadas.length === 1 ? 'avaliação' : 'avaliações'}` : 'sem avaliações';

  }

  // ===== Coluna 2: top autores =====
  function renderFanficAutores() {
    const porAutor = {};
    getFanficsFiltradas().forEach(f => {
      const nome = (f['Autor'] || '').toString().trim();
      if (!nome) return;
      const chave = fanficNorm(nome);
      if (!porAutor[chave]) porAutor[chave] = { nome, total: 0, lidas: 0 };
      porAutor[chave].total++;
      if (fanficLida(f)) porAutor[chave].lidas++;
    });

    const top = Object.values(porAutor)
      .sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome, 'pt-BR'))
      .slice(0, TOP_AUTORES);

    const el = document.getElementById('autores-list');
    if (!top.length) {
      el.innerHTML = '<div class="autores-vazio">Nenhum autor ainda.</div>';
    } else {
      el.innerHTML = top.map((a, i) => {
        const bar = splitBar(a.lidas, a.total);
        return `
          <div class="autor-row" title="${a.lidas} lidas · ${a.total - a.lidas} não lidas">
            <div class="autor-top">
              <span class="autor-nome"><span class="autor-pos">${i + 1}.</span>${fanficEsc(a.nome)}</span>
              <span class="autor-total">${a.total}</span>
            </div>
            ${bar.html}
          </div>
        `;
      }).join('');
    }

    // Legenda única no rodapé do painel
    const card = el.parentElement;
    if (!card.querySelector('.autores-legend')) {
      card.insertAdjacentHTML('beforeend', `
        <div class="autores-legend">
          <span><span class="dot" style="background: var(--cor-livro);"></span>Lidas</span>
          <span><span class="dot" style="background: var(--cor-fanfic);"></span>Não lidas</span>
        </div>`);
    }
  }

  // ===== Coluna 3: busca, ordenação e lista =====
  function renderFanficsConteudo() {
    let list = getFanficsFiltradas();

    // Filtro de série: mostra a série toda (todos os fandoms e status), por volume
    const chip = document.getElementById('fanfic-serie-chip');
    chip.hidden = !fanficSerie;
    if (fanficSerie) {
      document.getElementById('fanfic-serie-nome').textContent = fanficSerie;
      list = getTodasFanfics().filter(f => fanficNorm(serieDaObra(f)) === fanficNorm(fanficSerie))
        .sort((a, b) => volumeDaObra(a) - volumeDaObra(b));
    }

    if (!fanficSerie && fanficLeitura === 'naolidas') list = list.filter(f => !fanficLida(f));

    const termo = fanficSemAcento(fanficBusca);
    if (termo) {
      list = list.filter(f => fanficSemAcento(f['Título']).includes(termo) || fanficSemAcento(f['Autor']).includes(termo) ||
        fanficSemAcento(serieDaObra(f)).includes(termo));
    }

    if (fanficOrdem === 'alfa') {
      list = list.slice().sort((a, b) => (a['Título'] || '').toString().localeCompare((b['Título'] || '').toString(), 'pt-BR', { sensitivity: 'base' }));
    } else if (fanficOrdem === 'palavras') {
      list = list.slice().sort((a, b) => fanficNum(a['Palavras']) - fanficNum(b['Palavras']));
    }
    if (fanficOrdem && !fanficOrdemAsc) list.reverse();
    // Séries sempre juntas e em ordem de volume (exceto ao ordenar por palavras)
    if (!fanficSerie && fanficOrdem !== 'palavras') list = agruparSeries(list);

    // Estado visual dos botões de ordenação
    const btnAlfa = document.getElementById('sort-alfa');
    const btnPal = document.getElementById('sort-palavras');
    btnAlfa.classList.toggle('active', fanficOrdem === 'alfa');
    btnPal.classList.toggle('active', fanficOrdem === 'palavras');
    btnAlfa.querySelector('span').textContent = (fanficOrdem === 'alfa' && !fanficOrdemAsc) ? 'Z-A' : 'A-Z';
    btnAlfa.querySelector('i').className = (fanficOrdem === 'alfa' && !fanficOrdemAsc) ? 'fa-solid fa-arrow-up-z-a' : 'fa-solid fa-arrow-down-a-z';
    btnPal.querySelector('i').className = (fanficOrdem === 'palavras' && fanficOrdemAsc) ? 'fa-solid fa-arrow-up-short-wide' : 'fa-solid fa-arrow-down-wide-short';
    btnPal.title = (fanficOrdem === 'palavras' && fanficOrdemAsc) ? 'Menos palavras primeiro' : 'Mais palavras primeiro';

    const grid = document.getElementById('fanfic-cards-grid');
    if (list.length === 0) {
      const msg = termo ? `Nenhuma fanfiction encontrada para "${fanficEsc(fanficBusca)}".`
        : fanficLeitura === 'naolidas' ? 'Nenhuma fanfiction não lida aqui.'
        : fandomFiltro ? `Nenhuma fanfiction de ${fanficEsc(fandomFiltro)} cadastrada ainda.`
        : "Nenhuma fanfiction cadastrada na planilha com o tipo 'Fanfiction'.";
      grid.innerHTML = `<div class="obras-vazio">${msg}</div>`;
      return;
    }

    grid.innerHTML = list.map(renderObraRow).join('');
  }

  // ===== Linha de obra =====
  const STATUS_OPCOES = ['Lido', 'Lendo', 'Quero ler'];

  function statusClasse(status) {
    const st = fanficNorm(status);
    return st === 'lido' ? 'st-lido' : st === 'lendo' ? 'st-lendo' : st === 'quero ler' ? 'st-quero' : '';
  }

  function notaValor(f) {
    const v = parseFloat((f['Nota'] === undefined || f['Nota'] === null ? '' : f['Nota']).toString().replace(',', '.'));
    return isNaN(v) ? 0 : v;
  }

  function estrelasHtml(f) {
    const val = notaValor(f);
    let html = '';
    for (let i = 1; i <= 5; i++) {
      const cls = val >= i ? 'fa-solid fa-star' : val >= i - 0.5 ? 'fa-solid fa-star-half-stroke' : 'fa-regular fa-star';
      html += `<i class="${cls}" data-v="${i}"></i>`;
    }
    return html;
  }

  let obraAberta = null; // só uma linha com o plot expandido por vez

  function toggleObra(idx) {
    obraAberta = (obraAberta === idx) ? null : idx;
    document.querySelectorAll('.obra-card.aberta').forEach(c => c.classList.remove('aberta'));
    const card = document.querySelector(`.obra-card[data-idx="${idx}"]`);
    if (card && obraAberta === idx) card.classList.add('aberta');
  }

  // Coluna O da planilha: "favorita" / "abandonada"
  function obsDaObra(f) {
    const o = fanficSemAcento(f._obs);
    return { favorita: o.includes('favorit'), abandonada: o.includes('abandon') };
  }

  function renderObraRow(f) {
    const idx = allBooks.indexOf(f);
    const obs = obsDaObra(f);
    const plot = (f['Plot'] || '').toString().trim();
    const serie = serieDaObra(f);
    const volume = (f['Volume'] === undefined || f['Volume'] === null ? '' : f['Volume']).toString().trim();
    const serieHtml = serie
      ? ` · <span class="obra-serie" title="Ver a série toda" onclick="filtrarSerie(${idx}, event)"><i class="fa-solid fa-layer-group"></i> ${fanficEsc(serie)}${volume ? `, vol. ${fanficEsc(volume)}` : ''}</span>`
      : '';
    const releituras = Math.max(0, Math.floor(fanficNum(f['Releituras'])));
    const badges =
      (obs.favorita ? '<i class="fa-solid fa-heart obra-badge fav" title="Favorita"></i>' : '') +
      (obs.abandonada ? '<i class="fa-solid fa-ban obra-badge aband" title="Abandonada"></i>' : '');
    const lida = fanficLida(f);
    const statusAtual = (f['Status'] || '').toString().trim();
    const opcoes = STATUS_OPCOES.slice();
    if (statusAtual && !opcoes.some(o => fanficNorm(o) === fanficNorm(statusAtual))) opcoes.unshift(statusAtual);
    const capa = f['URL da imagem']
      ? `<img class="obra-capa" src="${fanficEsc(f['URL da imagem'])}" loading="lazy" alt="">`
      : `<div class="obra-capa"><i class="fa-solid fa-book"></i></div>`;

    return `
      <div class="obra-card ${statusClasse(statusAtual)}${obraAberta === idx ? ' aberta' : ''}${obs.abandonada ? ' abandonada' : ''}" data-idx="${idx}">
      <div class="obra-row">
        ${plot ? `<button type="button" class="obra-expand" onclick="toggleObra(${idx})" title="Ver plot"><i class="fa-solid fa-chevron-right"></i></button>` : '<span></span>'}
        ${capa}
        <div class="obra-titulo-bloco">
          <div class="obra-titulo-linha">
            <span class="obra-titulo" title="${fanficEsc(f['Título'])}">${fanficEsc(f['Título'] || 'Sem título')}</span>
            ${badges}
          </div>
          <span class="obra-autor">${fanficEsc(f['Autor'] || 'Autor desconhecido')}${serieHtml}</span>
        </div>
        <span class="obra-palavras">${f['Palavras'] ? fanficNum(f['Palavras']).toLocaleString('pt-BR') : '—'}</span>
        <span class="obra-cel"><span class="obra-fandom" title="${fanficEsc(f['Fandom'])}">${fanficEsc(f['Fandom'] || '—')}</span></span>
        <div class="obra-cel">
        ${lida ? `
          <span class="obra-status-fixo">Lido</span>
          <div class="obra-relida-wrap">
            <button type="button" class="obra-relida-btn${releituras ? ' ativo' : ''}"
                    title="${releituras ? `Relida ${releituras} ${releituras === 1 ? 'vez' : 'vezes'} — clique para alterar` : 'Marcar releitura'}"
                    onclick="toggleRelidaPop(${idx}, event)">
              <i class="fa-solid fa-rotate-right"></i>${releituras ? `<span>${releituras}</span>` : ''}
            </button>
            <div class="obra-relida-pop${relidaPopAberto === idx ? ' aberto' : ''}" id="relida-pop-${idx}" onclick="event.stopPropagation()">
              <div class="titulo">Releituras</div>
              <div class="stepper">
                <button type="button" onclick="alterarReleituras(${idx}, -1)">−</button>
                <span class="valor">${releituras}</span>
                <button type="button" onclick="alterarReleituras(${idx}, 1)">+</button>
              </div>
            </div>
          </div>` : `
          <select class="obra-status" onchange="alterarStatusObra(${idx}, this.value)">
            ${statusAtual ? '' : '<option value="" selected disabled>Selecione</option>'}
            ${opcoes.map(o => `<option value="${fanficEsc(o)}"${fanficNorm(o) === fanficNorm(statusAtual) ? ' selected' : ''}>${fanficEsc(o)}</option>`).join('')}
          </select>`}
        </div>
        <div class="obra-cel"><div class="obra-nota ${lida ? 'editavel' : 'bloqueada'}"
             title="${lida ? 'Clique para dar a nota (clique na mesma estrela para limpar)' : 'Marque como Lido para avaliar'}"
             ${lida ? `onclick="alterarNotaObra(${idx}, event)"` : ''}>
          ${estrelasHtml(f)}
        </div></div>
      </div>
      ${plot ? `<div class="obra-plot">${fanficEsc(plot)}</div>` : ''}
      </div>
    `;
  }

  // ===== Gravação na planilha =====
  let toastTimer = null;
  function fanficToast(msg, erro) {
    const t = document.getElementById('fanfic-toast');
    t.textContent = msg;
    t.classList.toggle('erro', !!erro);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), erro ? 5000 : 1800);
  }

  // Atualiza a tela inteira depois de uma mudança (Obsessões + painel do Prefácio)
  function atualizarTelasAposEdicao() {
    renderFanficsView();
    if (typeof renderDashboard === 'function') renderDashboard();
    if (typeof renderRecentReads === 'function') renderRecentReads();
  }

  function salvarObra(idx, campos, anterior, opcoes) {
    const f = allBooks[idx];
    const card = document.querySelector(`.obra-card[data-idx="${idx}"]`);
    if (card) card.classList.add('salvando');
    fanficToast('Salvando...');

    const payload = Object.assign({ row: f._row, titulo: f['Título'], autor: f['Autor'], campos }, opcoes || {});
    google.script.run
      .withSuccessHandler(raw => {
        const r = JSON.parse(raw);
        if (r.row) f._row = r.row;
        if (r.dataFinal) f['Data final'] = r.dataFinal;
        atualizarTelasAposEdicao();
        fanficToast('Salvo na planilha ✓');
      })
      .withFailureHandler(err => {
        Object.assign(f, anterior); // desfaz na tela
        atualizarTelasAposEdicao();
        fanficToast('Não foi possível salvar: ' + (err && err.message ? err.message : err), true);
      })
      .updateObraAPI(JSON.stringify(payload));

    atualizarTelasAposEdicao(); // mostra a mudança na hora (com a linha em "salvando")
    const novoCard = document.querySelector(`.obra-card[data-idx="${idx}"]`);
    if (novoCard) novoCard.classList.add('salvando');
  }

  function alterarStatusObra(idx, novoStatus) {
    const f = allBooks[idx];
    if (!f || !novoStatus || novoStatus === f['Status']) return;
    const anterior = { Status: f['Status'] };
    f['Status'] = novoStatus;
    const virouLido = fanficNorm(novoStatus) === 'lido';
    salvarObra(idx, { Status: novoStatus }, anterior, { preencherDataFinal: virouLido });
  }

  // ===== Releituras =====
  let relidaPopAberto = null; // índice da obra com o seletor aberto (sobrevive ao redesenho)

  function fecharRelidaPops() {
    relidaPopAberto = null;
    document.querySelectorAll('.obra-relida-pop.aberto').forEach(p => p.classList.remove('aberto'));
  }
  document.addEventListener('click', fecharRelidaPops);

  function toggleRelidaPop(idx, ev) {
    ev.stopPropagation();
    const pop = document.getElementById('relida-pop-' + idx);
    const abrir = !pop.classList.contains('aberto');
    fecharRelidaPops();
    if (abrir) { pop.classList.add('aberto'); relidaPopAberto = idx; }
  }

  function alterarReleituras(idx, delta) {
    const f = allBooks[idx];
    if (!f || !fanficLida(f)) return;
    const atual = Math.max(0, Math.floor(fanficNum(f['Releituras'])));
    const novo = Math.max(0, atual + delta);
    if (novo === atual) return;
    const anterior = { Releituras: f['Releituras'] };
    f['Releituras'] = novo || '';
    salvarObra(idx, { Releituras: novo }, anterior);
  }

  function alterarNotaObra(idx, ev) {
    const v = ev.target && ev.target.dataset ? Number(ev.target.dataset.v) : 0;
    const f = allBooks[idx];
    if (!v || !f || !fanficLida(f)) return;
    const atual = notaValor(f);
    const nova = (atual === v) ? '' : v; // clicar na mesma estrela limpa a nota
    const anterior = { Nota: f['Nota'] };
    f['Nota'] = nova;
    salvarObra(idx, { Nota: nova }, anterior);
  }
</script>
