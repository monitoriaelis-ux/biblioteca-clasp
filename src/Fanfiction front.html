<div class="fanfic-page-wrapper">
  <div class="fanfic-header-banner">
    <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Meus Universos & Fanfictions</h2>
    <p>Espaço dedicado para as histórias favoritas da web, contagem de palavras e fandoms.</p>
  </div>

  <div id="fanfic-cards-grid" class="fanfic-custom-grid">
    <div style="color: var(--texto-secundario); padding: 20px;">Carregando suas obsessões...</div>
  </div>
</div>

<style>
  .fanfic-page-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    padding: 4px;
  }
  
  .fanfic-header-banner {
    background: linear-gradient(135deg, #fce7f3 0%, #fef3c7 100%);
    padding: 24px;
    border-radius: 12px;
    border: 1px solid #fbcfe8;
    color: #831843;
  }
  
  .fanfic-header-banner h2 {
    font-size: 20px;
    margin-bottom: 6px;
    font-family: 'Poppins', sans-serif;
  }

  .fanfic-header-banner p {
    font-size: 12.5px;
    opacity: 0.85;
  }

  .fanfic-custom-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    padding-bottom: 20px;
  }

  .obsessao-card {
    background: #ffffff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 4px 12px rgba(131, 24, 67, 0.04);
    border-left: 5px solid #ec4899;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.2s ease;
    border-top: 1px solid #f1f5f9;
    border-right: 1px solid #f1f5f9;
    border-bottom: 1px solid #f1f5f9;
  }

  .obsessao-card:hover {
    transform: translateY(-2px);
  }

  .obsessao-title {
    font-weight: 700;
    font-size: 14.5px;
    color: #1e293b;
  }

  .obsessao-fandom {
    font-size: 10.5px;
    font-weight: 600;
    background: #fdf2f8;
    color: #db2777;
    padding: 2px 8px;
    border-radius: 6px;
    width: fit-content;
  }

  .obsessao-detalhes {
    font-size: 11.5px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    border-top: 1px solid #f1f5f9;
    padding-top: 8px;
  }
</style>

<script>
  (function initFanficsView() {
    google.script.run
      .withSuccessHandler(renderFanficsList)
      .getFanficsAPI();
  })();

  function renderFanficsList(responseJSON) {
    const list = JSON.parse(responseJSON);
    const grid = document.getElementById('fanfic-cards-grid');

    if (list.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--texto-secundario); padding: 40px;">Nenhuma fanfiction cadastrada na planilha com o tipo 'fanfiction' ou 'fanfic'.</div>`;
      return;
    }

    grid.innerHTML = list.map(f => `
      <div class="obsessao-card">
        <span class="obsessao-fandom">${f['Fandom'] || 'Fandom Geral'}</span>
        <div class="obsessao-title">${f['Título'] || 'Sem Título'}</div>
        <div style="font-size: 12px; color: var(--texto-secundario);">Por: ${f['Autor'] || 'Desconhecido'}</div>
        <div class="obsessao-detalhes">
          <span>Palavras: <strong>${f['Palavras'] ? Number(f['Palavras']).toLocaleString('pt-BR') : 'N/A'}</strong></span>
          <span>Status: <strong>${f['Status'] || 'Acompanhando'}</strong></span>
        </div>
      </div>
    `).join('');
  }
</script>
