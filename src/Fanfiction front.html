<!-- Seção "Minhas obsessões" — exibida dentro do Front.html (a navbar fica no Front). -->
<div class="fanfic-layout">

  <!-- Coluna 1 (fixa): filtro por fandom -->
  <aside class="fandom-sidebar">
    <button type="button" id="fandom-todos" class="fandom-todos-btn">
      <i class="fa-solid fa-layer-group"></i> Todos <span id="fandom-todos-total"></span>
    </button>
    <div id="fandom-cards" class="fandom-cards-list"></div>
  </aside>

  <!-- Coluna 2 (fixa): estatísticas e top autores — obedecem ao filtro de fandom -->
  <aside class="fanfic-stats">
    <div class="stat-card stat-lidas">
      <div class="stat-text">
        <span class="stat-label">Obras lidas</span>
        <span class="stat-value" id="stat-lidas">0</span>
        <span class="stat-sub" id="stat-lidas-sub"></span>
      </div>
      <i class="fa-solid fa-book-bookmark stat-icon"></i>
    </div>

    <div class="stat-card stat-nota">
      <div class="stat-text">
        <span class="stat-label">Nota média</span>
        <span class="stat-value" id="stat-nota">0.0</span>
      </div>
      <i class="fa-solid fa-star stat-icon" style="color: #E2A03F;"></i>
    </div>

    <div class="stat-card">
      <div class="stat-text">
        <span class="stat-label">Palavras lidas</span>
        <span class="stat-value" id="stat-palavras">0</span>
      </div>
      <i class="fa-solid fa-font stat-icon"></i>
    </div>

    <div class="stat-card stat-paginas">
      <div class="stat-text">
        <span class="stat-label">Págs. lidas</span>
        <span class="stat-value" id="stat-paginas">0</span>
      </div>
      <i class="fa-solid fa-book-open stat-icon"></i>
    </div>

    <div class="autores-card">
      <div class="autores-title"><i class="fa-solid fa-feather-pointed"></i> Top autores</div>
      <div id="autores-list" class="autores-list"></div>
    </div>
  </aside>

  <!-- Coluna 3: barra de busca fixa + lista de fanfics (rola) -->
  <div class="fanfic-main">
    <div class="fanfic-toolbar">
      <div class="fanfic-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="fanfic-search" placeholder="Buscar por título ou autor..." autocomplete="off">
      </div>
      <button type="button" class="fanfic-sort-btn" id="sort-alfa" title="Ordenar por título">
        <i class="fa-solid fa-arrow-down-a-z"></i> <span>A-Z</span>
      </button>
      <button type="button" class="fanfic-sort-btn" id="sort-palavras" title="Ordenar por número de palavras">
        <i class="fa-solid fa-arrow-down-wide-short"></i> <span>Palavras</span>
      </button>
    </div>

    <div class="fanfic-list-scroll">
      <div id="fanfic-cards-grid" class="fanfic-custom-grid">
        <div style="color: var(--texto-secundario); padding: 20px;">Carregando suas obsessões...</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ===== Configuração dos fandoms =====
  // "nome" é o que aparece no card. "aliases" são outras grafias aceitas na coluna Fandom
  // da planilha (maiúsculas/minúsculas e espaços nas pontas são ignorados).
  // "Outros" reúne toda fanfic cujo fandom não está na lista acima (ou está em branco).
  const FANDOMS = [
    { nome: 'House',      aliases: ['House M.D.', 'House MD'] },
    { nome: 'Bones',      aliases: [] },
    { nome: 'Avengers',   aliases: ['The Avengers', 'Vingadores'] },
    { nome: 'Station 19', aliases: [] },
    { nome: 'Gaga',       aliases: ['Lady Gaga'] },
    { nome: 'Outros',     outros: true }
  ];
  const TOP_AUTORES = 10;

  // Estado da página
  let fandomFiltro = null;          // null = todos os fandoms
  let fanficBusca = '';             // texto da caixa de pesquisa
  let fanficOrdem = null;           // null | 'alfa' | 'palavras'
  let fanficOrdemAsc = true;        // direção da ordenação
  let fanficEventosOk = false;

  function fanficNorm(v) { return (v || '').toString().trim().toLowerCase(); }

  // Para a busca: ignora maiúsculas e acentos
  function fanficSemAcento(v) {
    return fanficNorm(v).normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function fanficEsc(v) {
    return (v === undefined || v === null ? '' : v.toString())
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fanficNum(v) {
    const n = parseFloat((v || '').toString().replace(/\./g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }

  function fanficLida(f) { return fanficNorm(f['Status']) === 'lido'; }

  function getTodasFanfics() {
    return (typeof allBooks !== 'undefined' ? allBooks : [])
      .filter(b => ['fanfiction', 'fanfic'].includes(fanficNorm(b['Tipo'])));
  }

  // Retorna o nome do card (FANDOMS[].nome) ao qual a fanfic pertence
  function fandomDaFanfic(f) {
    const valor = fanficNorm(f['Fandom']);
    const achado = FANDOMS.find(fd => !fd.outros &&
      [fd.nome].concat(fd.aliases || []).some(n => fanficNorm(n) === valor));
    return achado ? achado.nome : 'Outros';
  }

  // Fanfics do fandom selecionado (base para estatísticas, autores e lista)
  function getFanficsFiltradas() {
    const todas = getTodasFanfics();
    return fandomFiltro ? todas.filter(f => fandomDaFanfic(f) === fandomFiltro) : todas;
  }

  function splitBar(lidas, total) {
    const pL = total ? Math.round((lidas / total) * 100) : 0;
    const pN = total ? 100 - pL : 0;
    return {
      pL, pN,
      html: `<div class="split-bar"><div class="split-bar-lidas" style="width:${pL}%"></div><div class="split-bar-naolidas" style="width:${pN}%"></div></div>`
    };
  }

  // Chamada pela navbar sempre que a seção é aberta e quando os dados recarregam
  function renderFanficsView() {
    setupFanficEventos();
    renderFandomCards();
    renderFanficStats();
    renderFanficAutores();
    renderFanficsConteudo();
  }

  function setupFanficEventos() {
    if (fanficEventosOk) return;
    fanficEventosOk = true;

    document.getElementById('fandom-todos').addEventListener('click', () => {
      fandomFiltro = null;
      renderFanficsView();
    });

    document.getElementById('fanfic-search').addEventListener('input', e => {
      fanficBusca = e.target.value;
      renderFanficsConteudo();
    });

    // 1º clique ativa; cliques seguintes invertem a direção
    document.getElementById('sort-alfa').addEventListener('click', () => toggleOrdem('alfa', true));
    document.getElementById('sort-palavras').addEventListener('click', () => toggleOrdem('palavras', false));
  }

  function toggleOrdem(tipo, ascPadrao) {
    if (fanficOrdem === tipo) fanficOrdemAsc = !fanficOrdemAsc;
    else { fanficOrdem = tipo; fanficOrdemAsc = ascPadrao; }
    renderFanficsConteudo();
  }

  // ===== Coluna 1 =====
  function renderFandomCards() {
    const todas = getTodasFanfics();
    document.getElementById('fandom-todos-total').textContent = `(${todas.length})`;
    document.getElementById('fandom-todos').classList.toggle('selected', !fandomFiltro);

    const lista = document.getElementById('fandom-cards');
    lista.classList.toggle('has-selection', !!fandomFiltro);

    lista.innerHTML = FANDOMS.map(fd => {
      const doFandom = todas.filter(f => fandomDaFanfic(f) === fd.nome);
      const total = doFandom.length;
      const lidas = doFandom.filter(fanficLida).length;
      const bar = splitBar(lidas, total);
      const sel = fandomFiltro === fd.nome ? ' selected' : '';

      return `
        <div class="fandom-card${sel}" data-fandom="${fanficEsc(fd.nome)}"
             title="${total ? `${lidas} lidas · ${total - lidas} não lidas` : 'Nenhuma história cadastrada'}">
          <div class="fandom-card-top">
            <span class="fandom-name">${fanficEsc(fd.nome)}</span>
            <span class="fandom-total">${total}<small>${total === 1 ? 'história' : 'histórias'}</small></span>
          </div>
          ${bar.html}
          <div class="fandom-legend">
            <span><span class="dot" style="background: var(--cor-livro);"></span>Lidas ${bar.pL}%</span>
            <span><span class="dot" style="background: var(--cor-fanfic);"></span>Não lidas ${bar.pN}%</span>
          </div>
        </div>
      `;
    }).join('');

    lista.querySelectorAll('.fandom-card').forEach(card => {
      card.addEventListener('click', () => {
        const nome = card.dataset.fandom;
        fandomFiltro = (fandomFiltro === nome) ? null : nome; // clicar de novo remove o filtro
        renderFanficsView();
      });
    });
  }

  // ===== Coluna 2: estatísticas =====
  function renderFanficStats() {
    const base = getFanficsFiltradas();
    const lidas = base.filter(fanficLida);

    document.getElementById('stat-lidas').textContent = lidas.length.toLocaleString('pt-BR');
    document.getElementById('stat-lidas-sub').textContent =
      base.length ? `de ${base.length} (${Math.round(lidas.length / base.length * 100)}%)` : 'nenhuma obra';

    const avaliadas = base.filter(f => f['Nota'] !== '' && f['Nota'] !== undefined && !isNaN(parseFloat(f['Nota'].toString().replace(',', '.'))));
    const nota = avaliadas.length
      ? avaliadas.reduce((s, f) => s + parseFloat(f['Nota'].toString().replace(',', '.')), 0) / avaliadas.length
      : 0;
    document.getElementById('stat-nota').textContent = nota.toFixed(1);

    const palavras = lidas.reduce((s, f) => s + fanficNum(f['Palavras']), 0);
    document.getElementById('stat-palavras').textContent = palavras.toLocaleString('pt-BR');

    // Mesma regra do Prefácio: "Páginas lidas" se existir; senão "Páginas" das obras lidas
    const paginas = base.reduce((s, f) => {
      let p = fanficNum(f['Páginas lidas']);
      if (!p && fanficLida(f)) p = fanficNum(f['Páginas'] || f['Paginas']);
      return s + p;
    }, 0);
    document.getElementById('stat-paginas').textContent = paginas.toLocaleString('pt-BR');
  }

  // ===== Coluna 2: top autores =====
  function renderFanficAutores() {
    const porAutor = {};
    getFanficsFiltradas().forEach(f => {
      const nome = (f['Autor'] || '').toString().trim();
      if (!nome) return;
      const chave = fanficNorm(nome);
      if (!porAutor[chave]) porAutor[chave] = { nome, total: 0, lidas: 0 };
      porAutor[chave].total++;
      if (fanficLida(f)) porAutor[chave].lidas++;
    });

    const top = Object.values(porAutor)
      .sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome, 'pt-BR'))
      .slice(0, TOP_AUTORES);

    const el = document.getElementById('autores-list');
    if (!top.length) {
      el.innerHTML = '<div class="autores-vazio">Nenhum autor ainda.</div>';
    } else {
      el.innerHTML = top.map((a, i) => {
        const bar = splitBar(a.lidas, a.total);
        return `
          <div class="autor-row" title="${a.lidas} lidas · ${a.total - a.lidas} não lidas">
            <div class="autor-top">
              <span class="autor-nome"><span class="autor-pos">${i + 1}.</span>${fanficEsc(a.nome)}</span>
              <span class="autor-total">${a.total}</span>
            </div>
            ${bar.html}
          </div>
        `;
      }).join('');
    }

    // Legenda única no rodapé do painel
    const card = el.parentElement;
    if (!card.querySelector('.autores-legend')) {
      card.insertAdjacentHTML('beforeend', `
        <div class="autores-legend">
          <span><span class="dot" style="background: var(--cor-livro);"></span>Lidas</span>
          <span><span class="dot" style="background: var(--cor-fanfic);"></span>Não lidas</span>
        </div>`);
    }
  }

  // ===== Coluna 3: busca, ordenação e lista =====
  function renderFanficsConteudo() {
    let list = getFanficsFiltradas();

    const termo = fanficSemAcento(fanficBusca);
    if (termo) {
      list = list.filter(f => fanficSemAcento(f['Título']).includes(termo) || fanficSemAcento(f['Autor']).includes(termo));
    }

    if (fanficOrdem === 'alfa') {
      list = list.slice().sort((a, b) => (a['Título'] || '').toString().localeCompare((b['Título'] || '').toString(), 'pt-BR', { sensitivity: 'base' }));
    } else if (fanficOrdem === 'palavras') {
      list = list.slice().sort((a, b) => fanficNum(a['Palavras']) - fanficNum(b['Palavras']));
    }
    if (fanficOrdem && !fanficOrdemAsc) list.reverse();

    // Estado visual dos botões de ordenação
    const btnAlfa = document.getElementById('sort-alfa');
    const btnPal = document.getElementById('sort-palavras');
    btnAlfa.classList.toggle('active', fanficOrdem === 'alfa');
    btnPal.classList.toggle('active', fanficOrdem === 'palavras');
    btnAlfa.querySelector('span').textContent = (fanficOrdem === 'alfa' && !fanficOrdemAsc) ? 'Z-A' : 'A-Z';
    btnAlfa.querySelector('i').className = (fanficOrdem === 'alfa' && !fanficOrdemAsc) ? 'fa-solid fa-arrow-up-z-a' : 'fa-solid fa-arrow-down-a-z';
    btnPal.querySelector('i').className = (fanficOrdem === 'palavras' && fanficOrdemAsc) ? 'fa-solid fa-arrow-up-short-wide' : 'fa-solid fa-arrow-down-wide-short';
    btnPal.title = (fanficOrdem === 'palavras' && fanficOrdemAsc) ? 'Menos palavras primeiro' : 'Mais palavras primeiro';

    const grid = document.getElementById('fanfic-cards-grid');
    if (list.length === 0) {
      const msg = termo ? `Nenhuma fanfiction encontrada para "${fanficEsc(fanficBusca)}".`
        : fandomFiltro ? `Nenhuma fanfiction de ${fanficEsc(fandomFiltro)} cadastrada ainda.`
        : "Nenhuma fanfiction cadastrada na planilha com o tipo 'Fanfiction'.";
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--texto-secundario); padding: 40px;">${msg}</div>`;
      return;
    }

    grid.innerHTML = list.map(f => `
      <div class="obsessao-card">
        <span class="obsessao-fandom">${fanficEsc(f['Fandom'] || 'Fandom Geral')}</span>
        <div class="obsessao-title">${fanficEsc(f['Título'] || 'Sem Título')}</div>
        <div style="font-size: 12px; color: var(--texto-secundario);">Por: ${fanficEsc(f['Autor'] || 'Desconhecido')}</div>
        <div class="obsessao-detalhes">
          <span>Palavras: <strong>${f['Palavras'] ? fanficNum(f['Palavras']).toLocaleString('pt-BR') : 'N/A'}</strong></span>
          <span>Status: <strong>${fanficEsc(f['Status'] || 'Acompanhando')}</strong></span>
        </div>
      </div>
    `).join('');
  }
</script>
