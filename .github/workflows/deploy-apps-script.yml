# Envia o conteúdo de src/ para o Apps Script sempre que a branch main muda.
# ATENÇÃO: "clasp push" substitui TODOS os arquivos do projeto no Apps Script
# pelo conteúdo de src/. Edite o código pelo GitHub, não pelo editor online.
name: Publicar no Apps Script

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".clasp.json"
  workflow_dispatch:

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se src/ tem o projeto
        run: |
          # Proteção: sem o manifesto, o push apagaria o projeto inteiro.
          if [ ! -f src/appsscript.json ]; then
            echo "::error::src/appsscript.json não existe. Rode antes o workflow 'Puxar do Apps Script'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Configurar credencial
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON não configurado. Veja o README."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Validar formato da credencial (sem mostrar valores)
        run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync(process.env.HOME + "/.clasprc.json", "utf8");
            console.log("Tamanho:", raw.length, "caracteres");
            let j;
            try { j = JSON.parse(raw); }
            catch (e) { console.log("::error::O secret CLASPRC_JSON nao e um JSON valido (copiado incompleto ou com quebras de linha?): " + e.message); process.exit(1); }
            const show = (o, p) => Object.keys(o).forEach(k => { console.log(p + k); if (o[k] && typeof o[k] === "object" && p.length < 4) show(o[k], p + "  "); });
            show(j, "- ");
            const t = j.token || {};
            if (!t.refresh_token) { console.log("::error::Credencial sem token.refresh_token. Formato inesperado (versao do clasp diferente de 2.4.2?)."); process.exit(1); }
          '

      - name: clasp push
        run: clasp push --force

      - name: Remover credencial
        if: always()
        run: rm -f ~/.clasprc.json
