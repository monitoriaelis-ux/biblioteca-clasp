# Baixa o código atual do Apps Script para a pasta src/ e faz commit.
# Rodar manualmente: Actions → "Puxar do Apps Script" → Run workflow.
name: Puxar do Apps Script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar clasp
        run: npm install -g @google/clasp@3

      - name: Configurar credencial
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON não configurado. Veja o README."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Validar formato da credencial (sem mostrar valores)
        run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync(process.env.HOME + "/.clasprc.json", "utf8");
            console.log("Tamanho:", raw.length, "caracteres");
            let j;
            try { j = JSON.parse(raw); }
            catch (e) { console.log("::error::O secret CLASPRC_JSON nao e um JSON valido (copiado incompleto ou com quebras de linha?): " + e.message); process.exit(1); }
            const show = (o, p) => Object.keys(o).forEach(k => { console.log(p + k); if (o[k] && typeof o[k] === "object" && p.length < 4) show(o[k], p + "  "); });
            show(j, "- ");
            const t = (j.tokens && j.tokens.default) || {};
            if (!t.refresh_token) { console.log("::error::Credencial sem tokens.default.refresh_token. Gere a credencial com o clasp 3.x."); process.exit(1); }
          '

      - name: clasp pull
        run: clasp pull

      - name: Commit das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Nada mudou no Apps Script."
          else
            git commit -m "Sincroniza código a partir do Apps Script"
            git push
          fi

      - name: Remover credencial
        if: always()
        run: rm -f ~/.clasprc.json
